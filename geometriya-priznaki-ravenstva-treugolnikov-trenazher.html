<main class="app"><div class="brand">✦ Сильная математика</div><h1 class="heading">Узнай признак равенства треугольников</h1><p class="sub">7 класс · Интерактивный тренажёр · 10 заданий</p><section class="panel" id="screen"></section><div class="footer">Сильная математика | Людмила Кузнецова</div></main><script>
const tests=[
{type:'sas',ask:'Какой признак здесь показан?',ans:0,exp:'Равны две соответствующие стороны и угол именно между ними.'},
{type:'asa',ask:'Какой признак здесь показан?',ans:1,exp:'Равны сторона и два угла, прилежащие к ней.'},
{type:'sss',ask:'Какой признак здесь показан?',ans:2,exp:'Равны три пары соответствующих сторон.'},
{type:'ssa',ask:'Можно ли доказать равенство только по этим данным?',ans:3,exp:'Две стороны и угол НЕ между ними — не признак равенства треугольников.'},
{type:'sas2',ask:'Определи признак для выделенных элементов.',ans:0,exp:'Угол между двумя выделенными сторонами — первый признак.'},
{type:'asa2',ask:'Определи признак для выделенных элементов.',ans:1,exp:'Сторона и два прилежащих к ней угла — второй признак.'},
{type:'sss2',ask:'Определи признак для выделенных элементов.',ans:2,exp:'Все три стороны выделены — третий признак.'},
{type:'aaa',ask:'Достаточно ли трёх равных углов?',ans:3,exp:'По трём углам треугольники подобны, но могут различаться по размеру.'},
{type:'sas3',ask:'Стороны AB и AC равны соответствующим сторонам другого треугольника, а углы A равны. Какой признак?',ans:0,exp:'Угол A расположен между AB и AC, поэтому подходит первый признак.'},
{type:'asa3',ask:'Равны стороны AB и DE, а также углы при концах этих сторон. Какой признак?',ans:1,exp:'Это сторона и оба прилежащих к ней угла — второй признак.'}];
let idx=0,score=0,selected=null,done=false,runs=0;const labels=['Первый признак','Второй признак','Третий признак','Данных недостаточно'];const root=document.getElementById('screen');
function draw(type){const sss=type.startsWith('sss'),sas=type.startsWith('sas'),asa=type.startsWith('asa'),ssa=type==='ssa',aaa=type==='aaa';let lines=sss?[0,1,2]:sas||ssa?[0,2]:asa?[0]:[];let angles=sas?[0]:asa?[0,1]:ssa?[2]:aaa?[0,1,2]:[];
// Coordinates: A bottom-left, B bottom-right, C top. edge indices AB, BC, CA. angle indices A,B,C.
const tri=(dx,mirror)=>{let A=[dx+26,140],B=[dx+150,140],C=[dx+(mirror?118:73),26];const P=[A,B,C];let edges=[[0,1],[1,2],[2,0]].map((e,k)=>`<line x1="${P[e[0]][0]}" y1="${P[e[0]][1]}" x2="${P[e[1]][0]}" y2="${P[e[1]][1]}" stroke="${lines.includes(k)?'#9260cf':'#b8aebf'}" stroke-width="${lines.includes(k)?5:2.2}" stroke-linecap="round"/>`).join('');
let marks=angles.map(k=>{let p=P[k],q=P[(k+1)%3],r=P[(k+2)%3];let u=[q[0]-p[0],q[1]-p[1]],v=[r[0]-p[0],r[1]-p[1]];const n=a=>{let z=Math.hypot(...a);return a.map(x=>x/z)};u=n(u);v=n(v);return `<path d="M${p[0]+u[0]*22},${p[1]+u[1]*22} Q${p[0]+(u[0]+v[0])*17},${p[1]+(u[1]+v[1])*17} ${p[0]+v[0]*22},${p[1]+v[1]*22}" stroke="#eda947" fill="none" stroke-width="4"/>`}).join('');let names=P.map((p,i)=>`<text x="${p[0]+[-13,8,0][i]}" y="${p[1]+[16,16,-10][i]}" font-size="13" fill="#534363" font-weight="650">${mirror?['D','E','F'][i]:['A','B','C'][i]}</text>`).join('');return edges+marks+names};
return `<svg viewBox="0 0 370 186" role="img" aria-label="Два треугольника с выделенными известными элементами"><rect x="0" y="0" width="370" height="186" rx="13" fill="#faf7ff"/>${tri(0,false)}${tri(188,true)}<line x1="182" y1="15" x2="182" y2="160" stroke="#ded2ee" stroke-dasharray="4 5"/><line x1="17" y1="174" x2="41" y2="174" stroke="#9260cf" stroke-width="5"/><text x="48" y="178" class="legend">равные стороны</text><path d="M200 174 Q208 164 216 174" stroke="#eda947" stroke-width="3" fill="none"/><text x="222" y="178" class="legend">равные углы</text></svg>`}
function report(){runs++;try{if(typeof ym==='function')ym(113722554,'reachGoal','check_answers',{test:document.title,attempt:runs,score:score+'/'+tests.length})}catch(e){}}
function render(){if(idx===tests.length){report();root.innerHTML=`<div class="end"><div style="font-size:45px">🎓</div><h2>Тренажёр пройден!</h2><p style="font-size:22px;font-weight:700">${score} из ${tests.length} верно</p><p>${score===10?'Отлично! Ты уверенно узнаёшь все признаки.':score>=7?'Хорошая работа! Повтори задания с ошибками.':'Повтори расположение выделенных элементов и попробуй ещё раз.'}</p><button class="primary" onclick="restart()">Пройти ещё раз</button></div>`;return}
let q=tests[idx];root.innerHTML=`<div class="top"><span>Задание ${idx+1} из ${tests.length}</span><span class="pill">Верно: ${score}</span></div><div class="progress"><div class="bar" style="width:${idx/tests.length*100}%"></div></div><div class="diagram">${draw(q.type)}</div><div class="question">${q.ask}</div><div class="hint">Фиолетовым и оранжевым выделены равные элементы двух треугольников.</div><div class="answers">${labels.map((a,i)=>`<button class="choice ${selected===i?'chosen':''}" onclick="choose(${i})" ${done?'disabled':''}>${a}</button>`).join('')}</div>${done?`<div class="feedback ${selected===q.ans?'good':'bad'}"><strong>${selected===q.ans?'Верно!':'Не совсем. Правильный ответ: '+labels[q.ans]+'.'}</strong><div>${q.exp}</div></div>`:''}<div class="controls"><button class="secondary" onclick="restart()">С начала</button><button class="primary" ${done?'':'disabled'} onclick="next()">${idx===tests.length-1?'Результат':'Дальше →'}</button></div>`}
function choose(v){if(done)return;selected=v;done=true;if(v===tests[idx].ans)score++;render()}function next(){if(!done)return;idx++;selected=null;done=false;render()}function restart(){idx=0;score=0;selected=null;done=false;render()}render();
</script></body></html>
