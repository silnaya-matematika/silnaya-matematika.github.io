<main class="app"><div class="brand">✦ Сильная математика</div><h1 class="heading">Признаки равенства треугольников</h1><p class="sub">7 класс · Интерактивный тренажёр · 10 заданий · каждый раз новый набор</p><section class="panel" id="screen"></section><div class="footer">Сильная математика | Людмила Кузнецова</div></main><script>
// ---------- мелкие помощники ----------
const pick = a => a[Math.floor(Math.random() * a.length)];
const randint = n => Math.floor(Math.random() * n);
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = randint(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const add = (a, b) => [a[0] + b[0], a[1] + b[1]], sub = (a, b) => [a[0] - b[0], a[1] - b[1]], mul = (a, k) => [a[0] * k, a[1] * k];
const len = a => Math.hypot(a[0], a[1]), unit = a => { const l = len(a) || 1; return [a[0] / l, a[1] / l]; };
const f = n => Math.round(n * 10) / 10;

// ---------- рисование ----------
function line(P, Q, c = '#4b3a66', w = 2.4, extra = '') {
  return `<line x1="${f(P[0])}" y1="${f(P[1])}" x2="${f(Q[0])}" y2="${f(Q[1])}" stroke="${c}" stroke-width="${w}" stroke-linecap="round" ${extra}/>`;
}
function ticks(P, Q, k) {            // k чёрточек на стороне PQ
  if (!k) return '';
  const m = mul(add(P, Q), .5), d = unit(sub(Q, P)), n = [-d[1], d[0]];
  let s = '';
  for (let i = 0; i < k; i++) {
    const c = add(m, mul(d, (i - (k - 1) / 2) * 5.5));
    s += line(add(c, mul(n, -6)), add(c, mul(n, 6)), '#7a4fc0', 2.5);
  }
  return s;
}
function arc(V, P, Q, k, r0 = 17) { // k дуг в углу PVQ
  if (!k) return '';
  const a1 = Math.atan2(P[1] - V[1], P[0] - V[0]), a2 = Math.atan2(Q[1] - V[1], Q[0] - V[0]);
  let d = a2 - a1; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI;
  const sweep = d > 0 ? 1 : 0;
  let s = '';
  for (let i = 0; i < k; i++) {
    const r = r0 + i * 5;
    s += `<path d="M${f(V[0] + r * Math.cos(a1))},${f(V[1] + r * Math.sin(a1))} A${r},${r} 0 0 ${sweep} ${f(V[0] + r * Math.cos(a2))},${f(V[1] + r * Math.sin(a2))}" fill="none" stroke="#e08a1e" stroke-width="2.6"/>`;
  }
  return s;
}
function label(txt, P, from, dist = 13, cls = 'vl') {
  const p = add(P, mul(unit(sub(P, from)), dist));
  return `<text x="${f(p[0])}" y="${f(p[1])}" text-anchor="middle" dominant-baseline="central" class="${cls}">${txt}</text>`;
}
function poly(P, fill = '#faf5ff') {
  return `<polygon points="${P.map(p => f(p[0]) + ',' + f(p[1])).join(' ')}" fill="${fill}" stroke="#4b3a66" stroke-width="2.4" stroke-linejoin="round"/>`;
}
const svgWrap = inner => `<svg viewBox="0 0 370 190" role="img" aria-label="Чертёж"><rect width="370" height="190" rx="13" fill="#faf7ff"/>${inner}</svg>`;
const centroid = P => mul(P.reduce((a, p) => add(a, p), [0, 0]), 1 / P.length);

function triSvg(P, names, m) {        // m = {s:[3], a:[3]}: число чёрточек / дуг
  const c = centroid(P);
  let s = poly(P);
  for (let i = 0; i < 3; i++) {
    s += ticks(P[i], P[(i + 1) % 3], m.s[i]);
    s += arc(P[i], P[(i + 1) % 3], P[(i + 2) % 3], m.a[i]);
    s += label(names[i], P[i], c);
  }
  return s;
}
function xform(pts, theta, mirror) {
  return pts.map(p => { const x = mirror ? -p[0] : p[0], y = p[1]; return [x * Math.cos(theta) - y * Math.sin(theta), x * Math.sin(theta) + y * Math.cos(theta)]; });
}
function placePair(P1, P2) {          // один масштаб для обоих треугольников
  const boxes = [{ x: 26, y: 30, w: 134, h: 124 }, { x: 210, y: 30, w: 134, h: 124 }];
  const lists = [P1, P2];
  const bb = pts => { const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]); return [Math.min(...xs), Math.max(...xs), Math.min(...ys), Math.max(...ys)]; };
  const k = Math.min(...lists.map((L, i) => { const [x0, x1, y0, y1] = bb(L); return Math.min(boxes[i].w / (x1 - x0), boxes[i].h / (y1 - y0)); }));
  return lists.map((L, i) => {
    const [x0, x1, y0, y1] = bb(L), cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, b = boxes[i];
    return L.map(p => [b.x + b.w / 2 + (p[0] - cx) * k, b.y + b.h / 2 + (p[1] - cy) * k]);
  });
}
const DIV = line([185, 10], [185, 175], '#ded2ee', 1.5, 'stroke-dasharray="4 5"');
function pairSvg(P1, P2, n1, n2, m) {
  const [Q1, Q2] = placePair(P1, P2);
  return svgWrap(triSvg(Q1, n1, m) + triSvg(Q2, n2, m) + DIV);
}

// ---------- данные ----------
const SHAPES = [
  [[0, 1], [1.04, .78], [.81, 0]], [[0, 1], [1.26, .96], [.08, 0]],
  [[.3, 1], [1.5, .8], [0, .15]], [[0, .95], [1.35, 1], [.1, 0]]
];
const NAMEPAIRS = [[['A', 'B', 'C'], ['D', 'E', 'F']], [['A', 'B', 'C'], ['K', 'L', 'M']], [['A', 'B', 'C'], ['M', 'N', 'P']],
  [['K', 'L', 'M'], ['P', 'Q', 'R']], [['M', 'N', 'K'], ['A', 'B', 'C']], [['A', 'B', 'C'], ['P', 'Q', 'R']]];
const NAMESETS = [['A', 'B', 'C', 'D'], ['K', 'L', 'M', 'N'], ['M', 'N', 'P', 'Q'], ['P', 'Q', 'R', 'S']];
const SIGNS = ['Первый признак', 'Второй признак', 'Третий признак', 'Данных недостаточно'];
const side = (n, i) => n[i] + n[(i + 1) % 3];
const ang = (n, i) => '∠' + n[i];
const eqS = (n1, n2, i) => `${side(n1, i)} = ${side(n2, i)}`;
const eqA = (n1, n2, i) => `${ang(n1, i)} = ${ang(n2, i)}`;

// ---------- типы заданий ----------
// Все функции возвращают {svg, ask, hint, options[], ans (индекс в options), exp, fixedLast}

function triKind(kind) {
  const [n1, n2] = pick(NAMEPAIRS);
  const base = pick(SHAPES);
  const P1 = xform(base, (Math.random() - .5) * .5, Math.random() < .5);
  let P2 = xform(base, pick([-2.4, -1.7, -.9, .9, 1.7, 2.4]), Math.random() < .5);
  const m = { s: [0, 0, 0], a: [0, 0, 0] };
  let ans, exp, ask = 'Какой признак равенства треугольников здесь показан?';
  if (kind === 'sas') {
    const v = randint(3), w = (v + 2) % 3;
    m.s[v] = 1; m.s[w] = 2; m.a[v] = 1; ans = 0;
    exp = `Равны две стороны (${side(n1, v)} = ${side(n2, v)} и ${side(n1, w)} = ${side(n2, w)}) и угол ${n1[v]} = ${n2[v]} между ними — первый признак.`;
  } else if (kind === 'asa') {
    const e = randint(3), e2 = (e + 1) % 3;
    m.s[e] = 1; m.a[e] = 1; m.a[e2] = 2; ans = 1;
    exp = `Равны сторона ${side(n1, e)} = ${side(n2, e)} и два угла, прилежащие к ней (${ang(n1, e)} = ${ang(n2, e)}, ${ang(n1, e2)} = ${ang(n2, e2)}) — второй признак.`;
  } else if (kind === 'sss') {
    m.s = [1, 2, 3]; ans = 2;
    exp = 'Равны все три пары соответствующих сторон — третий признак.';
  } else if (kind === 'ssa') {
    // две стороны и угол НЕ между ними: два разных треугольника с одинаковыми отмеченными элементами
    const deg = pick([45, 50]), beta = deg * Math.PI / 180, b = deg === 45 ? .76 : .8;
    const Ap = [Math.cos(beta), -Math.sin(beta)], d = Math.sqrt(b * b - Math.sin(beta) ** 2);
    const T1 = [Ap, [0, 0], [Math.cos(beta) - d, 0]], T2 = [Ap, [0, 0], [Math.cos(beta) + d, 0]];
    P2 = xform(T2, pick([.3, -.3, 0]), true);
    m.s = [1, 0, 2]; m.a = [0, 1, 0]; ans = 3;
    ask = 'Равны ли эти треугольники? Выберите признак или ответ «Данных недостаточно».';
    exp = `Равны две стороны (${side(n1, 0)} и ${side(n1, 2)}) и угол ${n1[1]}, но он лежит НЕ между этими сторонами. Треугольники на рисунке разные, значит, такого признака нет.`;
    return pack({ svg: pairSvg(T1, P2, n1, n2, m), ask, hint: 'marks', ans, exp });
  } else { // aaa
    P2 = xform(base.map(p => mul(p, 1.45)), pick([-2.4, -1.7, .9, 1.7]), Math.random() < .5);
    m.a = [1, 2, 3]; ans = 3;
    ask = 'Равны ли эти треугольники? Выберите признак или ответ «Данных недостаточно».';
    exp = 'Равенство трёх углов не доказывает равенство треугольников: они подобны, но могут быть разных размеров (как на рисунке).';
  }
  return pack({ svg: pairSvg(P1, P2, n1, n2, m), ask, hint: 'marks', ans, exp });
}
function pack(t) { return Object.assign({ options: SIGNS, fixedLast: true }, t); }

// две фигуры по общей стороне (четырёхугольник с диагональю AC)
function commonSide() {
  const [A, B, C, D] = pick(NAMESETS), flip = Math.random() < .5;
  const variant = pick(['kiteSAS', 'kiteSSS', 'paraSSS', 'paraASA', 'paraSAS']);
  const kite = variant.startsWith('kite');
  let pA, pB, pC, pD;
  if (kite) { pA = [60, 100]; pC = [310, 100]; pB = [160, 28]; pD = [160, 172]; }
  else { pA = [45, 140]; pB = [115, 35]; pC = [310, 52]; pD = add(sub(pA, pB), pC); }
  let pts = [pA, pB, pC, pD];
  if (flip) pts = pts.map(p => [370 - p[0], p[1]]);
  [pA, pB, pC, pD] = pts;
  const cen = centroid(pts);
  let s = poly(pts, '#fbf8ff') + line(pA, pC, '#4b3a66', 2.4, 'stroke-dasharray="6 5"');
  let ans, exp;
  const T = `Δ${A}${B}${C} = Δ${kite ? A + D + C : C + D + A}`;
  if (variant === 'kiteSAS') {
    s += ticks(pA, pB, 1) + ticks(pA, pD, 1) + arc(pA, pB, pC, 1) + arc(pA, pD, pC, 1); ans = 0;
    exp = `У треугольников ${A}${B}${C} и ${A}${D}${C}: ${A}${B} = ${A}${D}, ∠${B}${A}${C} = ∠${D}${A}${C} и общая сторона ${A}${C}. Две стороны и угол между ними — первый признак.`;
  } else if (variant === 'kiteSSS') {
    s += ticks(pA, pB, 1) + ticks(pA, pD, 1) + ticks(pC, pB, 2) + ticks(pC, pD, 2); ans = 2;
    exp = `${A}${B} = ${A}${D}, ${C}${B} = ${C}${D} и сторона ${A}${C} общая. Три пары равных сторон — третий признак.`;
  } else if (variant === 'paraSSS') {
    s += ticks(pA, pB, 1) + ticks(pC, pD, 1) + ticks(pB, pC, 2) + ticks(pD, pA, 2); ans = 2;
    exp = `${A}${B} = ${C}${D}, ${B}${C} = ${D}${A} и сторона ${A}${C} общая. Три пары равных сторон — третий признак.`;
  } else if (variant === 'paraASA') {
    s += arc(pA, pB, pC, 1) + arc(pC, pD, pA, 1) + arc(pC, pB, pA, 2, 22) + arc(pA, pD, pC, 2, 22); ans = 1;
    exp = `Сторона ${A}${C} общая, ∠${B}${A}${C} = ∠${D}${C}${A} и ∠${B}${C}${A} = ∠${D}${A}${C} — прилежащие к ней углы. Второй признак.`;
  } else { // paraSAS
    s += ticks(pB, pC, 2) + ticks(pD, pA, 2) + arc(pC, pB, pA, 1) + arc(pA, pD, pC, 1); ans = 0;
    exp = `${B}${C} = ${D}${A}, ∠${B}${C}${A} = ∠${D}${A}${C} и общая сторона ${A}${C}: две стороны и угол между ними — первый признак.`;
  }
  s += label(A, pA, cen) + label(B, pB, cen) + label(C, pC, cen) + label(D, pD, cen);
  return pack({ svg: svgWrap(s), ask: `Какой признак доказывает равенство треугольников ${T}?`, hint: 'marksDash', ans, exp });
}

// два отрезка пересекаются в точке O
function crossing() {
  const [A, B, C, D] = pick(NAMESETS), flip = Math.random() < .5;
  const O = [185, 95];
  let pA = [70, 38], pC = [300, 36];
  let pB = sub(mul(O, 2), pA), pD = sub(mul(O, 2), pC);
  if (flip) { [pA, pB, pC, pD, ] = [pA, pB, pC, pD].map(p => [370 - p[0], p[1]]); }
  const variant = pick(['sas', 'asa', 'num']);
  const cen = O;
  let s = line(pA, pB) + line(pC, pD) + line(pA, pC) + line(pB, pD);
  s += `<circle cx="${O[0]}" cy="${O[1]}" r="2.6" fill="#4b3a66"/>` + label('O', O, add(O, [0, 18]), 10);
  let ans, exp, ask, options = SIGNS, fixedLast = true;
  const T = `Δ${A}O${C} и Δ${B}O${D}`;
  if (variant === 'sas' || variant === 'num') {
    s += ticks(pA, O, 1) + ticks(O, pB, 1) + ticks(pC, O, 2) + ticks(O, pD, 2);
  } else {
    s += ticks(pA, O, 1) + ticks(O, pB, 1) + arc(pA, O, pC, 1) + arc(pB, O, pD, 1);
  }
  s += label(A, pA, cen) + label(B, pB, cen) + label(C, pC, cen) + label(D, pD, cen);
  if (variant === 'sas') {
    ans = 0; ask = `Отрезки ${A}${B} и ${C}${D} пересекаются в точке O. Какой признак доказывает равенство ${T}?`;
    exp = `${A}O = O${B}, ${C}O = O${D}, а углы ${A}O${C} и ${B}O${D} равны как вертикальные. Две стороны и угол между ними — первый признак.`;
  } else if (variant === 'asa') {
    ans = 1; ask = `Отрезки ${A}${B} и ${C}${D} пересекаются в точке O. Какой признак доказывает равенство ${T}?`;
    exp = `${A}O = O${B}, ∠${C}${A}O = ∠${D}${B}O и углы ${A}O${C}, ${B}O${D} равны как вертикальные. Сторона и два прилежащих угла — второй признак.`;
  } else {
    const x = pick([5, 6, 7, 8, 9, 12]);
    ask = `Отрезки ${A}${B} и ${C}${D} пересекаются в точке O, ${A}O = O${B}, ${C}O = O${D}. Известно, что ${A}${C} = ${x} см. Найдите ${B}${D}.`;
    options = shuffle([x, x + 2, x - 2 > 0 ? x - 2 : x + 4, 2 * x]).map(v => v + ' см'); fixedLast = false;
    ans = options.indexOf(x + ' см');
    exp = `Δ${A}O${C} = Δ${B}O${D} по первому признаку (вертикальные углы при O), поэтому ${B}${D} = ${A}${C} = ${x} см.`;
  }
  return { svg: svgWrap(s), ask, hint: 'marks', options, ans, exp, fixedLast };
}

// равнобедренный треугольник с отрезком BD
function isosceles() {
  const [A, B, C, D] = pick(NAMESETS);
  const pB = [185, 22], pA = [62, 160], pC = [308, 160], pD = [185, 160];
  const variant = pick(['median', 'bisector']);
  let s = poly([pA, pB, pC], '#fbf8ff') + line(pB, pD);
  s += ticks(pA, pB, 1) + ticks(pB, pC, 1);
  let ans, exp, kind;
  if (variant === 'median') {
    s += ticks(pA, pD, 2) + ticks(pD, pC, 2); ans = 2; kind = `${B}${D} — медиана`;
    exp = `${A}${B} = ${B}${C}, ${A}${D} = ${D}${C} (медиана делит сторону пополам) и ${B}${D} — общая сторона. Три пары равных сторон — третий признак.`;
  } else {
    s += arc(pB, pA, pD, 1, 24) + arc(pB, pD, pC, 1, 24); ans = 0; kind = `${B}${D} — биссектриса`;
    exp = `${A}${B} = ${B}${C}, ∠${A}${B}${D} = ∠${D}${B}${C} (биссектриса делит угол пополам) и ${B}${D} — общая сторона. Первый признак.`;
  }
  s += label(A, pA, [185, 100]) + label(B, pB, [185, 100]) + label(C, pC, [185, 100]) + label(D, pD, [185, 100]);
  return pack({ svg: svgWrap(s), ask: `В равнобедренном треугольнике ${A}${B}${C} (${A}${B} = ${B}${C}) отрезок ${kind}. Какой признак доказывает равенство треугольников ${A}${B}${D} и ${C}${B}${D}?`, hint: 'marks', ans, exp });
}

// соответственные элементы равных треугольников
function corresponding() {
  const [n1, n2] = pick([[['A', 'B', 'C'], ['M', 'N', 'K']], [['A', 'B', 'C'], ['P', 'Q', 'R']], [['K', 'L', 'M'], ['D', 'E', 'F']], [['A', 'B', 'C'], ['E', 'F', 'D']], [['M', 'N', 'P'], ['C', 'A', 'B']]]);
  const base = pick(SHAPES);
  const P1 = xform(base, (Math.random() - .5) * .4, Math.random() < .5), P2 = xform(base, pick([-2.2, -1.5, 1.4, 2.3]), Math.random() < .5);
  const svg = pairSvg(P1, P2, n1, n2, { s: [0, 0, 0], a: [0, 0, 0] });
  const triples = [[5, 7, 9], [6, 8, 11], [4, 9, 10], [7, 8, 12], [5, 6, 10]];
  const angs = [[40, 65, 75], [35, 55, 90], [50, 60, 70], [30, 80, 70], [45, 50, 85]];
  const useSide = Math.random() < .5, vals = pick(useSide ? triples : angs), u = useSide ? ' см' : '°';
  const j = randint(3);                         // про какой элемент спрашиваем
  let givenTxt, ask, answerV, exp;
  if (useSide) {
    const e = [0, 1, 2];                       // стороны AB, BC, CA
    givenTxt = e.map(i => `${side(n1, i)} = ${vals[i]} см`).join(', ');
    ask = `Δ${n1.join('')} = Δ${n2.join('')}. Известно: ${givenTxt}. Найдите ${side(n2, j)}.`;
    answerV = vals[j];
    exp = `В равных треугольниках соответственные стороны равны. Вершинам ${n1.join(', ')} соответствуют ${n2.join(', ')}, поэтому ${side(n2, j)} соответствует ${side(n1, j)} = ${vals[j]} см.`;
  } else {
    givenTxt = [0, 1, 2].map(i => `${ang(n1, i)} = ${vals[i]}°`).join(', ');
    ask = `Δ${n1.join('')} = Δ${n2.join('')}. Известно: ${givenTxt}. Найдите ${ang(n2, j)}.`;
    answerV = vals[j];
    exp = `Вершинам ${n1.join(', ')} соответствуют ${n2.join(', ')}, поэтому ${ang(n2, j)} соответствует ${ang(n1, j)} = ${vals[j]}°.`;
  }
  const others = vals.filter((_, i) => i !== j);
  let options = shuffle([answerV, ...others].slice(0, 3).concat([answerV + (useSide ? 3 : 10)])).map(v => v + u);
  options = [...new Set(options)];
  while (options.length < 4) options.push((answerV + 5 + options.length) + u);
  options = shuffle(options.slice(0, 4));
  if (!options.includes(answerV + u)) options[0] = answerV + u;
  return { svg, ask, hint: 'names', options, ans: options.indexOf(answerV + u), exp, fixedLast: false };
}

// какое равенство добавить
function missing() {
  const [n1, n2] = pick(NAMEPAIRS);
  const base = pick(SHAPES);
  const P1 = xform(base, (Math.random() - .5) * .5, Math.random() < .5), P2 = xform(base, pick([-2.3, -1.6, 1.0, 1.8, 2.4]), Math.random() < .5);
  const m = { s: [0, 0, 0], a: [0, 0, 0] };
  const kind = pick(['first-ss', 'first-sa', 'second-sa', 'second-aa', 'third']);
  const el = { sides: i => ({ t: 's', i }), ang: i => ({ t: 'a', i }) };
  let marked, need, ordinal;
  const v = randint(3);
  if (kind === 'first-ss') { marked = [el.sides(v), el.sides((v + 2) % 3)]; need = el.ang(v); ordinal = 'первому'; }
  else if (kind === 'first-sa') { marked = [el.sides(v), el.ang(v)]; need = el.sides((v + 2) % 3); ordinal = 'первому'; }
  else if (kind === 'second-sa') { marked = [el.sides(v), el.ang(v)]; need = el.ang((v + 1) % 3); ordinal = 'второму'; }
  else if (kind === 'second-aa') { marked = [el.ang(v), el.ang((v + 1) % 3)]; need = el.sides(v); ordinal = 'второму'; }
  else { marked = [el.sides(v), el.sides((v + 1) % 3)]; need = el.sides((v + 2) % 3); ordinal = 'третьему'; }
  marked.forEach((e, k) => { (e.t === 's' ? m.s : m.a)[e.i] = k + 1; });
  const txt = e => e.t === 's' ? eqS(n1, n2, e.i) : eqA(n1, n2, e.i);
  const all = [0, 1, 2].map(i => el.sides(i)).concat([0, 1, 2].map(i => el.ang(i)));
  const key = e => e.t + e.i;
  const rest = all.filter(e => !marked.some(x => key(x) === key(e)));
  const options = shuffle(rest.map(txt));
  const ans = options.indexOf(txt(need));
  return { svg: pairSvg(P1, P2, n1, n2, m), ask: `На рисунке отмечены равные элементы. Какое ещё равенство нужно, чтобы доказать равенство треугольников по ${ordinal} признаку?`, hint: 'marks', options, ans, exp: `Для ${ordinal} признака не хватает равенства «${txt(need)}»: оно стоит в нужном месте относительно уже отмеченных элементов.`, fixedLast: false };
}

// теория
function theory() {
  const bank = [
    { ask: 'Какое утверждение выражает ПЕРВЫЙ признак равенства треугольников?', right: 'Две стороны и угол между ними одного треугольника равны двум сторонам и углу между ними другого',
      wrong: ['Две стороны и угол, не лежащий между ними, одного треугольника равны соответствующим элементам другого', 'Три угла одного треугольника равны трём углам другого', 'Сторона и два прилежащих к ней угла одного треугольника равны стороне и двум углам другого'],
      exp: 'Первый признак — «две стороны и угол между ними» (СУС).' },
    { ask: 'Какое утверждение выражает ВТОРОЙ признак равенства треугольников?', right: 'Сторона и два прилежащих к ней угла одного треугольника равны стороне и двум прилежащим к ней углам другого',
      wrong: ['Две стороны и угол между ними одного треугольника равны двум сторонам и углу между ними другого', 'Три стороны одного треугольника равны трём сторонам другого и один угол равен', 'Два угла одного треугольника равны двум углам другого'],
      exp: 'Второй признак — «сторона и два прилежащих угла» (УСУ).' },
    { ask: 'Какое утверждение выражает ТРЕТИЙ признак равенства треугольников?', right: 'Три стороны одного треугольника равны трём сторонам другого',
      wrong: ['Три угла одного треугольника равны трём углам другого', 'Две стороны одного треугольника равны двум сторонам другого', 'Сторона и два угла одного треугольника равны стороне и двум углам другого'],
      exp: 'Третий признак — «три стороны» (ССС).' },
    { ask: 'У двух треугольников равны по три угла. Следует ли из этого, что треугольники равны?', right: 'Нет: треугольники могут быть разных размеров',
      wrong: ['Да, это третий признак', 'Да, если ещё равны два угла', 'Да, это второй признак'],
      exp: 'Три равных угла — признак подобия, а не равенства.' },
    { ask: 'У двух треугольников равны две стороны и угол, не лежащий между ними. Что можно сказать?', right: 'Равенство не гарантировано: нужно ещё что-то проверить',
      wrong: ['Треугольники равны по первому признаку', 'Треугольники равны по второму признаку', 'Треугольники равны по третьему признаку'],
      exp: 'Первый признак требует, чтобы угол лежал МЕЖДУ равными сторонами.' }
  ];
  const t = pick(bank);
  const options = shuffle([t.right, ...t.wrong]);
  return { svg: '', ask: t.ask, hint: '', options, ans: options.indexOf(t.right), exp: t.exp, fixedLast: false, long: true };
}

// ---------- набор из 10 заданий ----------
function makeSet() {
  const nel = Math.random() < .5 ? 'ssa' : 'aaa';
  const set = [triKind('sas'), triKind('asa'), triKind('sss'), triKind(nel),
    commonSide(), crossing(), isosceles(), pick([corresponding, missing])(), pick([missing, corresponding, commonSide])(), theory()];
  // вариант «найти соответственный элемент» не повторяем дважды
  return shuffle(set);
}

// ---------- экран ----------
let tasks = makeSet(), idx = 0, score = 0, selected = null, done = false, runs = 0;
const root = document.getElementById('screen');
function prepare(t) {                 // перемешиваем варианты ответов (кроме «Данных недостаточно»)
  if (t._opts) return;
  let opts = t.options.map((o, i) => ({ o, ok: i === t.ans }));
  if (t.fixedLast) { const last = opts.pop(); shuffle(opts); opts.push(last); } else shuffle(opts);
  t._opts = opts;
}
const hints = {
  marks: 'Одинаковые чёрточки на сторонах — равные стороны. Одинаковые дуги у вершин — равные углы.',
  marksDash: 'Одинаковые чёрточки на сторонах — равные стороны. Одинаковые дуги у вершин — равные углы. Пунктир — диагональ, общая сторона двух треугольников.',
  names: 'Равенство Δ записано так, что вершины соответствуют друг другу по порядку букв.'
};
function report() {
  runs++;
  try { if (typeof ym === 'function') ym(113722554, 'reachGoal', 'check_answers', { test: document.title, attempt: runs, score: score + '/' + tasks.length }); } catch (e) {}
}
function render() {
  if (idx === tasks.length) {
    report();
    root.innerHTML = `<div class="end"><div style="font-size:45px">🎓</div><h2>Тренажёр пройден!</h2><p style="font-size:22px;font-weight:700">${score} из ${tasks.length} верно</p><p>${score === tasks.length ? 'Отлично! Ты уверенно узнаёшь признаки равенства.' : score >= 7 ? 'Хорошая работа! Нажми «Пройти ещё раз» — задания будут новые.' : 'Повтори признаки и попробуй ещё раз — задания будут новые.'}</p><button class="primary" onclick="restart()">Пройти ещё раз</button></div>`;
    return;
  }
  const q = tasks[idx]; prepare(q);
  const cls = q.long || q._opts.some(x => x.o.length > 26) && !/см|°/.test(q._opts[0].o) ? 'answers one' : 'answers';
  root.innerHTML = `<div class="top"><span>Задание ${idx + 1} из ${tasks.length}</span><span class="pill">Верно: ${score}</span></div><div class="progress"><div class="bar" style="width:${idx / tasks.length * 100}%"></div></div>${q.svg ? `<div class="diagram">${q.svg}</div>` : ''}<div class="question">${q.ask}</div>${q.hint && hints[q.hint] ? `<div class="hint">${hints[q.hint]}</div>` : ''}<div class="${cls}">${q._opts.map((x, i) => `<button class="choice ${done && x.ok ? 'right' : selected === i ? 'chosen' : ''}" onclick="choose(${i})" ${done ? 'disabled' : ''}>${x.o}</button>`).join('')}</div>${done ? `<div class="feedback ${q._opts[selected].ok ? 'good' : 'bad'}"><strong>${q._opts[selected].ok ? 'Верно!' : 'Не совсем. Правильный ответ: ' + q._opts.find(x => x.ok).o + '.'}</strong><div>${q.exp}</div></div>` : ''}<div class="controls"><button class="secondary" onclick="restart()">С начала</button><button class="primary" ${done ? '' : 'disabled'} onclick="next()">${idx === tasks.length - 1 ? 'Результат' : 'Дальше →'}</button></div>`;
}
function choose(i) { if (done) return; selected = i; done = true; if (tasks[idx]._opts[i].ok) score++; render(); }
function next() { if (!done) return; idx++; selected = null; done = false; render(); }
function restart() { tasks = makeSet(); idx = 0; score = 0; selected = null; done = false; render(); }
render();
</script></body></html>
